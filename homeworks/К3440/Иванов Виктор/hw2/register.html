<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Регистрация — Столик</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="assets/style.css" rel="stylesheet"><link href="assets/accessibility.css" rel="stylesheet"></head><body><a class="skip-link" href="#main">Перейти к содержимому</a><header class="site-header"><nav class="navbar container"><a class="brand navbar-brand" href="index.html"><span class="brand-mark" aria-hidden="true">●</span>Столик</a><a href="index.html">К ресторанам</a></nav></header><main id="main" tabindex="-1" class="container"><div class="auth-wrap surface p-4 p-md-5"><p class="eyebrow">Присоединяйтесь</p><h1 class="page-title h2">Создайте аккаунт</h1><form id="auth-form" data-mode="register"><div class="mb-3"><label class="form-label" for="name">Имя</label><input class="form-control" id="name" name="name" autocomplete="name" required></div><div class="mb-3"><label class="form-label" for="email">Электронная почта</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Пароль (от 8 символов)</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required></div><p id="status" role="status" aria-live="polite"></p><button class="btn btn-primary w-100" type="submit">Создать аккаунт</button></form><p class="mt-4 mb-0">Уже есть аккаунт? <a href="login.html">Войти</a></p></div></main><footer class="site-footer mt-5 py-4"><div class="container">© 2026 Столик · Учебный проект</div></footer><script src="assets/app.js"></script></body></html>
